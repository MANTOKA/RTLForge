[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verilog-agent"
version = "0.0.1"
description = "Lightweight multi-agent RTL generation, verification, and repair system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[tool.setuptools]
py-modules = ["tool_wrapper"]

[tool.pytest.ini_options]
addopts = "-ra -p no:cacheprovider"
testpaths = ["tests"]
markers = [
    "integration: requires a running Docker engine and builds the sandbox image",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
