[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rtlforge"
version = "0.3.0"
description = "Agent platform for RTL design, verification, and implementation"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}

dependencies = [
    "python-dotenv>=1.0,<2",
    "tomli>=2; python_version < '3.11'",
]

[project.urls]
Repository = "https://github.com/MANTOKA/RTLForge"
Documentation = "https://github.com/MANTOKA/RTLForge/tree/main/docs"

[project.optional-dependencies]
mcp = [
    "mcp>=1.20,<2",
]
llm = [
    "openai>=1.68.0",
]
graph = [
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[tool.setuptools]
py-modules = ["tool_wrapper"]

[tool.setuptools.packages.find]
include = ["rtlforge*"]

[tool.setuptools.package-data]
"rtlforge.web" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
addopts = "-ra -p no:cacheprovider --basetemp=.pytest_tmp"
testpaths = ["tests"]
markers = [
    "integration: requires a running Docker engine and builds the sandbox image",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
