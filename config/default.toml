schema_version = 1

[sandbox]
image = "verilog-agent-sandbox"
network = "none"
read_only_root = true
workdir = "/work"
user_uid = 10001
user_gid = 10001
tmpfs_mb = 64
memory_mb = 512
cpus = 1.0
pids_limit = 128

[tools]
compile_timeout_seconds = 30
lint_timeout_seconds = 30
simulate_timeout_seconds = 60
benchmark_timeout_seconds = 120

[orchestration]
domain_schema_version = 1
max_candidates = 2
max_repairs = 3
checkpoint_every_transition = true

[model]
provider = "openai_responses"
model = ""
base_url = ""
request_timeout_seconds = 120
max_output_tokens = 8192
max_retries = 2

[logging]
level = "INFO"
format = "jsonl"
destination = "stderr"
redact_keys = ["api_key", "authorization", "token", "password"]
